[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenspace-kolding"
version = "0.1.0"
description = "Reproducible GIS analysis of urban green-space accessibility in Kolding"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
